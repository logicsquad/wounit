name: Deploy

on:
  # A push to master is a release: it deploys to Maven Central and publishes.
  push:
    branches:
      - master
  # A manual run is a rehearsal: it deploys the version given, which the
  # Central Portal validates but doesn't publish. Drop the deployment in the
  # Portal afterwards.
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy, such as 2.0-rc1
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out WOUnit source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Import the signing key
        env:
          GPG_SECRET_KEYS: ${{ secrets.GPG_SECRET_KEYS }}
        run: echo "$GPG_SECRET_KEYS" | base64 --decode | gpg --import --no-tty --batch --yes

      - name: Set the rehearsal version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          mvn --batch-mode --no-transfer-progress --settings .maven_settings.xml
          org.codehaus.mojo:versions-maven-plugin:2.22.0:set
          -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      # .maven_settings.xml reads the Central Portal token from the
      # environment, and maven-gpg-plugin reads MAVEN_GPG_PASSPHRASE.
      - name: Build and deploy to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          AUTO_PUBLISH: ${{ github.event_name == 'push' }}
        run: >-
          mvn --batch-mode --no-transfer-progress --settings .maven_settings.xml
          --activate-profiles release clean deploy
          -Dgpg.keyname="$GPG_KEYNAME" -Dcentral.autoPublish="$AUTO_PUBLISH"
